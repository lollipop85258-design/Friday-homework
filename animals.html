<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAUNA - 臺灣特有種動物誌 (進階地圖與快搜版)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        :root {
            --color-bg: #0b0f0c;
            --color-surface: #131a15;
            --color-gold: #dfba73;
            --font-serif: "Times New Roman", "Noto Serif TC", serif;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--color-bg); color: #e0e0e0; padding-top: 80px; }
        .tag-navbar { background-color: rgba(11, 15, 12, 0.85); box-shadow: 0 1px 0px rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1030; }
        .nav-home-btn { border: 1px solid rgba(255,255,255,0.2); color: #ffffff; font-size: 0.8rem; letter-spacing: 1px; transition: all 0.3s; }
        .nav-home-btn:hover { border-color: var(--color-gold); color: var(--color-gold); background: transparent; }
        .map-section { background-color: var(--color-surface); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .map-box { background: radial-gradient(circle, #1a261f 0%, #0b0f0c 100%); height: 280px; border: 1px dashed rgba(223, 186, 115, 0.3); display: flex; align-items: center; justify-content: center; position: relative; }
        .map-dot { position: absolute; width: 14px; height: 14px; background-color: var(--color-gold); border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px var(--color-gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        .region-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; transition: all 0.3s; width: 100%; }
        .region-btn.active, .region-btn:hover { background: var(--color-gold); color: var(--color-bg); border-color: var(--color-gold); font-weight: bold; }
        .filter-sidebar { background-color: var(--color-surface); border: 1px solid rgba(255,255,255,0.05); padding: 25px; position: sticky; top: 100px; }
        .filter-title { font-size: 0.95rem; color: var(--color-gold); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; }
        .form-check-input:checked { background-color: var(--color-gold); border-color: var(--color-gold); }
        .animal-section { background-color: var(--color-surface); border: 1px solid rgba(255, 255, 255, 0.03); padding: 40px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); scroll-margin-top: 100px; }
        .img-container { overflow: hidden; }
        .animal-img { width: 100%; height: 300px; object-fit: cover; filter: grayscale(15%); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .animal-section:hover .animal-img { filter: grayscale(0%); transform: scale(1.02); }
        .status-badge { font-size: 0.7rem; letter-spacing: 1px; padding: 3px 10px; background-color: rgba(223, 186, 115, 0.1) !important; color: var(--color-gold); border: 1px solid rgba(223, 186, 115, 0.3); border-radius: 2px; text-transform: uppercase; display: inline-block; }
        .animal-title-link { text-decoration: none; color: #ffffff; font-size: 1.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; transition: color 0.3s; margin-top: 8px; }
        .animal-title-link:hover { color: var(--color-gold); }
        .video-hint { font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 400; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .scientific-name { font-family: var(--font-serif); color: rgba(255,255,255,0.4); font-size: 1.05rem; margin-bottom: 20px; }
        .meta-box { border-left: 2px solid var(--color-gold); padding-left: 15px; margin-bottom: 15px; }
        .meta-label { font-size: 0.75rem; color: var(--color-gold); display: block; margin-bottom: 2px; }
        .features-text { color: rgba(255,255,255,0.7); line-height: 1.8; font-size: 0.95rem; text-align: justify; }
        footer { background-color: #070a08; color: rgba(255,255,255,0.2); padding: 30px 0; font-size: 0.8rem; margin-top: 60px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top tag-navbar py-3">
        <div class="container px-3">
            <a class="btn nav-home-btn rounded-0" href="index.html">← ARCHIVE</a>
            <span class="navbar-brand text-success fw-bold ms-3" style="color: var(--color-gold) !important;">FAUNA / 動物地理誌</span>
        </div>
    </nav>

    <section class="container mt-4">
        <div class="map-section">
            <div class="row g-4 align-items-center">
                <div class="col-md-5">
                    <h5 class="fw-bold text-white mb-2" style="font-family: var(--font-serif);">GEOGRAPHIC DISTRIBUTION</h5>
                    <p class="text-white-50 small mb-4">點擊下方流域或山脈分區，觀看地理分佈數據與宣導事項：</p>
                    <div class="row g-2">
                        <div class="col-6"><button class="btn region-btn text-start active" onclick="filterRegion('all', this)">🌐 顯示全島物種</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('north', this)">🏞️ 北部流域</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('mid', this)">🌲 高山原始林</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('south', this)">🎋 南部平原</button></div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="map-box rounded">
                        <div id="map-info-panel" class="p-4 text-center">
                            <h6 class="fw-bold" style="color: var(--color-gold);" id="panel-title">台灣全域生態監測面板</h6>
                            <p class="small text-white-50 mb-0" id="panel-desc">點選左側分區，系統將載入 Google Maps API 點位覆蓋模擬數據與特定棲地宣導事項。</p>
                            <div class="alert alert-warning small mt-3 bg-dark text-warning border-warning py-1 mb-0" id="panel-alert">
                                📢 宣導：全島山區請配合林署規範，注意「無痕山林（LNT）」。
                            </div>
                        </div>
                        <div class="map-dot" style="top: 25%; left: 55%;"></div>
                        <div class="map-dot" style="top: 50%; left: 48%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="filter-sidebar rounded">
                    <h6 class="fw-bold text-white mb-3" style="font-family: var(--font-serif);">DYNAMIC FILTER</h6>
                    
                    <div class="mb-4">
                        <div class="filter-title">關鍵字搜尋 (SEARCH)</div>
                        <div class="input-group">
                            <input type="text" id="keyword-search" class="form-control bg-dark text-white border-secondary small" placeholder="輸入名稱、學名或特徵..." onkeyup="filterAnimals()" style="font-size: 0.85rem;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="filter-title">保育等級 (STATUS)</div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="瀕臨絕種" id="c1" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="c1">瀕臨絕種</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="珍貴稀有" id="c2" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="c2">珍貴稀有</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="應予保育" id="c3" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="c3">應予保育</label></div>
                    </div>
                    <div>
                        <div class="filter-title">棲地類型 (HABITAT)</div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="森林" id="h1" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="h1">原始森林/山脈</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="溪流" id="h2" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="h2">高山溪流/水源</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="平原" id="h3" onchange="filterAnimals()"><label class="form-check-label small text-white-50" for="h3">平原竹林/農田</label></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-9" id="animal-list-container"></div>
        </div>
    </div>

    <footer class="text-center"><p class="mb-0">© 2026 FORMOSA ARCHIVE. NATURAL HISTORY MUSEUM.</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const animals = [
            { id: "bear", name: "台灣黑熊", status: "瀕臨絕種", habitatTag: "森林", region: "mid", scientific: "Ursus thibetanus formosanus", habitat: "全島中高海拔原始森林", features: "胸前帶有極具識別度的白色「V」字紋。作為台灣唯一的原生熊類，牠們不僅er森林健全度與守護野性的最高指標。", image: "https://img.shoplineapp.com/media/image_clips/683bdce28a0355000c117576/original.jpg?1748753634", videoUrl: "https://www.youtube.com/results?search_query=台灣黑熊+紀錄片" },
            { id: "salmon", name: "櫻花鉤吻鮭", status: "瀕臨絕種", habitatTag: "溪流", region: "north", scientific: "Oncorhynchus masou formosanus", habitat: "大甲溪上游冷冽高山溪流", features: "堪稱大自然留在島嶼的「冰河活化石」。因地形變遷退縮至高山溪源，轉化為罕見的陸封型鮭魚。側身帶有絕美的雲狀斑點，靜臥於七家灣溪澄澈的水流之中。", image: "https://upload.wikimedia.org/wikipedia/commons/4/4f/%E6%AB%BB%E8%8A%B1%E9%89%A4%E5%90%BB%E9%AE%AD_02.jpg", videoUrl: "https://www.youtube.com/results?search_query=櫻花鉤吻鮭+紀錄片" },
            { id: "pheasant", name: "帝雉", status: "珍貴稀有", habitatTag: "森林", region: "mid", scientific: "Syrmaticus mikado", habitat: "針闊葉混生林之高海拔迷霧帶", features: "優雅踱步於中央山脈迷霧林道的尊貴王者。雄鳥羽翼覆蓋著內斂而璀璨的帶光澤深紫藍，尾羽橫陳銀白紋理，其高傲警覺的身影常現於破曉與薄暮時分。", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLoDgbyDDQ1v5chCXPrjDcxJ8hcrQ8VLfxPCHguDWDGisEEzh4SW8kw5TP4hIRL3BmvnaGJbSY0eB0BpmPjevRYo2Bo7s8CaV10sM_tF4f&s=10", videoUrl: "https://www.youtube.com/results?search_query=黑長尾雉+帝雉+紀錄片" },
            { id: "magpie", name: "台灣藍鵲", status: "應予保育", habitatTag: "森林", region: "north", scientific: "Urocissa caerulea", habitat: "中低海拔闊葉林冠層", features: "拖曳著極其華麗的碧藍尾羽，降臨於山林低谷間。牠們擁有極高的家族社會性，採用獨特的「巢邊幫手」制度共同養育後代，性情剽悍且高度團結。", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSiv_lYie_rYGeyhQqU5GCATGlDyt0DNO6Ooi50zCBoqkuvz3Cn5XmSHnTTAk3qtoQXTueMr27GcdrvZbK5loFq4ishzqwNqpoZcPJ3Cd6YA&s=10", videoUrl: "https://www.youtube.com/results?search_query=台灣藍鵲+紀錄片" },
            { id: "deer", name: "台灣水鹿", status: "珍貴稀有", habitatTag: "森林", region: "mid", scientific: "Rusa unicolor swinhoei", habitat: "高海拔箭竹草原與冷杉林", features: "島嶼上最大型的草食獸。雄鹿頂著傲人的多叉硬角，其腳印深烙在中央山脈的屋脊之上。近年保育成效顯著，常現身於高山湖泊之畔，飲水凝望。", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBXBK5DCtTzM1j2BaAq9wE8bnBee6ljdmlqA&s", videoUrl: "https://www.youtube.com/results?search_query=台灣水鹿+紀錄片" },
            { id: "leopard", name: "台灣石虎", status: "瀕臨絕種", habitatTag: "森林", region: "mid", scientific: "Prionailurus bengalensis chinensis", habitat: "中低海拔淺山與農林交界地", features: "島嶼僅存的原生貓科動物。額頂至眼窩綻放著兩條如淚痕般的精緻白線，身上佈滿野性豹斑。牠們潛伏於人類與荒野邊界，正承受著棲地破碎與生存夾擊的警訊。", image: "https://web3.nmns.edu.tw/exhibits/107/leopardcat/assets/images/in-cont-3-1200x800.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣石虎+紀錄片" },

            { id: "salamander", name: "台灣山椒魚", status: "瀕臨絕種", habitatTag: "溪流", region: "mid", scientific: "Hynobius formosanus", habitat: "高海拔溪源與冷濕碎石地底部", features: "自遠古冰河時期遺留至今的有尾兩棲類。身軀短小、皮膚滑潤，畏懼高溫。長年隱匿在玉山或合歡山冰冷碎石下的極限環境中，默默見證島嶼數十萬年的氣候巨變。", image: "https://e-info.org.tw/images/7f8c0940-975c-4af6-8483-e64f0be34511.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣山椒魚+紀錄片" }
        ];

        let currentRegion = 'all';

        function renderAnimals(filteredList) {
            const container = document.getElementById('animal-list-container');
            container.innerHTML = '';
            if(filteredList.length === 0) {
                container.innerHTML = `<div class="p-5 text-center text-white-50">沒有符合篩選條件的生物數據。</div>`;
                return;
            }
            filteredList.forEach(animal => {
                container.innerHTML += `
                    <section id="${animal.id}" class="animal-section">
                        <div class="row align-items-center g-5">
                            <div class="col-lg-5"><div class="img-container"><img src="${animal.image}" class="animal-img" alt="${animal.name}"></div></div>
                            <div class="col-lg-7">
                                <div><span class="status-badge">${animal.status}</span></div>
                                <h2 class="fw-bold m-0"><a href="${animal.videoUrl}" target="_blank" class="animal-title-link" title="觀看紀錄片">${animal.name} <span class="video-hint">DOCUMENTARY ↗</span></a></h2>
                                <div class="scientific-name">${animal.scientific}</div>
                                <div class="meta-box"><span class="meta-label">HABITAT / 棲地環境</span><span class="text-white-50">${animal.habitat}</span></div>
                                <p class="features-text">${animal.features}</p>
                            </div>
                        </div>
                    </section>`;
            });
        }

        function filterAnimals() {
            const checkedBoxes = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(cb => cb.value);
            const statusFilters = checkedBoxes.filter(val => ["瀕臨絕種", "珍貴稀有", "應予保育"].includes(val));
            const habitatFilters = checkedBoxes.filter(val => ["森林", "溪流", "平原"].includes(val));
            
            const searchQuery = document.getElementById('keyword-search').value.toLowerCase().trim();

            let result = animals;
            if (currentRegion !== 'all') result = result.filter(a => a.region === currentRegion);
            if (statusFilters.length > 0) result = result.filter(a => statusFilters.includes(a.status));
            if (habitatFilters.length > 0) result = result.filter(a => habitatFilters.includes(a.habitatTag));
            
            if (searchQuery !== '') {
                result = result.filter(a => 
                    a.name.toLowerCase().includes(searchQuery) || 
                    a.scientific.toLowerCase().includes(searchQuery) || 
                    a.habitat.toLowerCase().includes(searchQuery) || 
                    a.features.toLowerCase().includes(searchQuery)
                );
            }

            renderAnimals(result);
        }

        function filterRegion(region, element) {
            currentRegion = region;
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const title = document.getElementById('panel-title');
            const desc = document.getElementById('panel-desc');
            const alertBox = document.getElementById('panel-alert');

            if(region === 'all') {
                title.innerText = "臺灣全域生態監測面板";
                alertBox.innerText = "📢 宣導：全島山區請配合林署規範，注意「無痕山林（LNT）」。";
            } else if (region === 'north') {
                title.innerText = "🏞️ 探測區域：北部雪山溪流群";
                desc.innerText = "大甲溪高山清澈溪流，此區水質受到嚴密監控，為陸封型孑遺鮭魚的核心繁衍地。";
                alertBox.innerText = "🚫 宣導：七家灣溪核心保育區全面禁止進入、垂釣與騷擾生物，違者重罰！";
            } else if (region === 'mid') {
                title.innerText = "🌲 探測區域：中央山脈中高海拔原始林";
                desc.innerText = "大型草食與貓科動物的主要棲息廊道。此區林相完整度極高，為生態保育重鎮。";
                alertBox.innerText = "🐻 宣導：進入林區請隨身攜帶熊鈴，遇到黑熊或水鹿請保持安全距離，切勿餵食。";
            } else if (region === 'south') {
                title.innerText = "🎋 探測區域：諸羅平地與次生林農田";
                desc.innerText = "南台灣平原與竹林交界帶，為觀察低海拔平原農業與兩棲類共生的關鍵核心指標區。";
                alertBox.innerText = "🐸 宣導：宣導友善農作，減少殺蟲劑與農藥使用，保護低海拔兩棲類繁衍地。";
            }
            filterAnimals();
        }

        renderAnimals(animals);
    </script>
</body>
