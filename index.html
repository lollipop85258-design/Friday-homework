<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 臺灣特有生物數位誌 - Formosa Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --color-bg-dark: #0f1a11;
            --color-primary: #1e3524;
            --color-gold: #dfba73;
            --font-serif: "Times New Roman", "Noto Serif TC", serif;
        }
        body {
            font-family: "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
            background-color: var(--color-bg-dark);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(30, 53, 36, 0.4) 0%, rgba(15, 26, 17, 0) 90%);
            z-index: -1;
        }
        header { padding: 80px 0 40px 0; }
        .site-title { font-family: var(--font-serif); font-size: 2.8rem; letter-spacing: 4px; font-weight: 700; color: #ffffff; margin-bottom: 5px; }
        .site-subtitle { font-size: 0.95rem; letter-spacing: 6px; color: var(--color-gold); text-transform: uppercase; }
        .main-container { flex: 1; display: flex; align-items: center; }
        .choice-card {
            display: block;
            height: 480px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .card-inner { width: 100%; height: 100%; background-size: cover; background-position: center; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .card-animal .card-inner { background-image: linear-gradient(rgba(15, 26, 17, 0.1), rgba(15, 26, 17, 0.85)), url('https://img.shoplineapp.com/media/image_clips/683bdce28a0355000c117576/original.jpg?1748753634'); }
        .card-plant .card-inner { background-image: linear-gradient(rgba(15, 26, 17, 0.1), rgba(15, 26, 17, 0.85)), url('https://www.newsmarket.com.tw/files/2020/05/%E7%B4%85%E6%AA%9C%E5%A4%A7%E6%A8%B9%E4%BB%B0%E8%A7%92-%E8%AC%9D%E4%BD%B3%E5%80%AB%E6%94%9D%E6%98%A5%E5%B1%B1%E5%87%BA%E7%89%88%E7%A4%BE%E6%8F%90%E4%BE%9B.jpg'); }
        .choice-card:hover { transform: translateY(-10px); border-color: var(--color-gold); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); }
        .choice-card:hover .card-inner { transform: scale(1.05); }
        .card-content { position: absolute; bottom: 40px; left: 40px; right: 40px; z-index: 2; }
        .card-content h2 { font-size: 1.8rem; font-weight: 600; color: #ffffff; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        .card-content p { color: rgba(255, 255, 255, 0.6); font-size: 0.95rem; letter-spacing: 1px; margin-bottom: 20px; }
        .explore-btn { font-size: 0.8rem; letter-spacing: 2px; color: var(--color-gold); text-transform: uppercase; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: gap 0.3s; }
        .choice-card:hover .explore-btn { gap: 15px; }
        footer { padding: 30px 0; font-size: 0.8rem; letter-spacing: 1px; color: rgba(255,255,255,0.3); border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <header class="text-center">
        <h1 class="site-title">FORMOSA ARCHIVE</h1>
        <div class="site-subtitle">臺灣特有生物數位誌</div>
    </header>

    <div class="container main-container my-4">
        <div class="row w-100 justify-content-center g-4">
            <div class="col-md-5">
                <a href="animals.html" class="choice-card card-animal">
                    <div class="card-inner"></div>
                    <div class="card-content">
                        <h2>FAUNA <span>/ 動物篇</span></h2>
                        <p>收錄黑熊、石虎、山椒魚等十種棲息於高山與秘境的國寶級野生動物。</p>
                        <div class="explore-btn">Explore Collection <span>→</span></div>
                    </div>
                </a>
            </div>
            <div class="col-md-5">
                <a href="plants.html" class="choice-card card-plant">
                    <div class="card-inner"></div>
                    <div class="card-content">
                        <h2>FLORA <span>/ 植物篇</span></h2>
                        <p>收錄紅檜、台灣杉、玉山薊等十種歷經冰河孑遺、獨存於此的島嶼奇蹟。</p>
                        <div class="explore-btn">Explore Collection <span>→</span></div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer class="text-center">
        <p class="mb-0">© 2026 FORMOSA ARCHIVE. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
