<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORA - 臺灣特有種植物誌 (進階地圖與快搜版)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        :root {
            --color-bg: #0e0d0b;
            --color-surface: #181613;
            --color-gold: #dfba73;
            --font-serif: "Times New Roman", "Noto Serif TC", serif;
        }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--color-bg); color: #e0e0e0; padding-top: 80px; }
        .tag-navbar { background-color: rgba(14, 13, 11, 0.85); box-shadow: 0 1px 0px rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1030; }
        .nav-home-btn { border: 1px solid rgba(255,255,255,0.2); color: #ffffff; font-size: 0.8rem; letter-spacing: 1px; transition: all 0.3s; }
        .nav-home-btn:hover { border-color: var(--color-gold); color: var(--color-gold); background: transparent; }
        .map-section { background-color: var(--color-surface); border: 1px solid rgba(255, 255, 255, 0.05); padding: 30px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .map-box { background: radial-gradient(circle, #211e18 0%, #0e0d0b 100%); height: 280px; border: 1px dashed rgba(223, 186, 115, 0.3); display: flex; align-items: center; justify-content: center; position: relative; }
        .map-dot { position: absolute; width: 14px; height: 14px; background-color: var(--color-gold); border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px var(--color-gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        .region-btn { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; transition: all 0.3s; width: 100%; }
        .region-btn.active, .region-btn:hover { background: var(--color-gold); color: var(--color-bg); border-color: var(--color-gold); font-weight: bold; }
        .filter-sidebar { background-color: var(--color-surface); border: 1px solid rgba(255,255,255,0.05); padding: 25px; position: sticky; top: 100px; }
        .filter-title { font-size: 0.95rem; color: var(--color-gold); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; font-weight: bold; }
        .form-check-input:checked { background-color: var(--color-gold); border-color: var(--color-gold); }
        .plant-section { background-color: var(--color-surface); border: 1px solid rgba(255, 255, 255, 0.03); padding: 40px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); scroll-margin-top: 100px; }
        .img-container { overflow: hidden; }
        .plant-img { width: 100%; height: 300px; object-fit: cover; filter: grayscale(15%) sepia(8%); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .plant-section:hover .plant-img { filter: grayscale(0%) sepia(0%); transform: scale(1.02); }
        .status-badge { font-size: 0.7rem; letter-spacing: 1px; padding: 3px 10px; background-color: rgba(223, 186, 115, 0.1) !important; color: var(--color-gold); border: 1px solid rgba(223, 186, 115, 0.3); border-radius: 2px; text-transform: uppercase; display: inline-block; }
        .plant-title-link { text-decoration: none; color: #ffffff; font-size: 1.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; transition: color 0.3s; margin-top: 8px; }
        .plant-title-link:hover { color: var(--color-gold); }
        .video-hint { font-size: 0.75rem; color: rgba(255,255,255,0.4); font-weight: 400; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .scientific-name { font-family: var(--font-serif); color: rgba(255,255,255,0.4); font-size: 1.05rem; margin-bottom: 20px; }
        .meta-box { border-left: 2px solid var(--color-gold); padding-left: 15px; margin-bottom: 15px; }
        .meta-label { font-size: 0.75rem; color: var(--color-gold); display: block; margin-bottom: 2px; }
        .features-text { color: rgba(255,255,255,0.7); line-height: 1.8; font-size: 0.95rem; text-align: justify; }
        footer { background-color: #0b0a09; color: rgba(255,255,255,0.2); padding: 30px 0; font-size: 0.8rem; margin-top: 60px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top tag-navbar py-3">
        <div class="container px-3">
            <a class="btn nav-home-btn rounded-0" href="index.html">← ARCHIVE</a>
            <span class="navbar-brand text-success fw-bold ms-3" style="color: var(--color-gold) !important;">FLORA / 植物地理誌</span>
        </div>
    </nav>

    <section class="container mt-4">
        <div class="map-section">
            <div class="row g-4 align-items-center">
                <div class="col-md-5">
                    <h5 class="fw-bold text-white mb-2" style="font-family: var(--font-serif);">BOTANICAL DISTRIBUTION</h5>
                    <p class="text-white-50 small mb-4">點擊下方垂直林帶分區，觀看植物林相數據與宣導事項：</p>
                    <div class="row g-2">
                        <div class="col-6"><button class="btn region-btn text-start active" onclick="filterRegion('all', this)">🌐 顯示全島植物</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('high', this)">🏔️ 高山寒帶主稜</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('mid', this)">🌲 中海拔雲霧帶</button></div>
                        <div class="col-6"><button class="btn region-btn text-start" onclick="filterRegion('low', this)">🌿 溪谷與低海拔</button></div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="map-box rounded">
                        <div id="map-info-panel" class="p-4 text-center">
                            <h6 class="fw-bold" style="color: var(--color-gold);" id="panel-title">台灣特有植物分佈面板</h6>
                            <p class="small text-white-50 mb-0" id="panel-desc">點選左側垂直海拔高度帶，系統將載入對應之植感垂直分佈數據與保育警示。</p>
                            <div class="alert alert-warning small mt-3 bg-dark text-warning border-warning py-1 mb-0" id="panel-alert">
                                📢 宣導：森林為全島之肺，入山請落實無痕山林，嚴禁任意採摘任何野生植物。
                            </div>
                        </div>
                        <div class="map-dot" style="top: 35%; left: 52%;"></div>
                        <div class="map-dot" style="top: 60%; left: 45%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
                <div class="filter-sidebar rounded">
                    <h6 class="fw-bold text-white mb-3" style="font-family: var(--font-serif);">DYNAMIC FILTER</h6>
                    
                    <div class="mb-4">
                        <div class="filter-title">關鍵字搜尋 (SEARCH)</div>
                        <div class="input-group">
                            <input type="text" id="keyword-search" class="form-control bg-dark text-white border-secondary small" placeholder="輸入名稱、學名或特徵..." onkeyup="filterPlants()" style="font-size: 0.85rem;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="filter-title">保育等級 (STATUS)</div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="瀕臨絕種" id="p1" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="p1">瀕臨絕種</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="珍貴稀有" id="p2" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="p2">珍貴稀有</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="一般野生" id="p3" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="p3">一般野生</label></div>
                    </div>
                    <div>
                        <div class="filter-title">植物型態 (MORPHOLOGY)</div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="喬木" id="m1" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="m1">高聳喬木 / 針葉林</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="草本" id="m2" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="m2">高山草本 / 珍稀蘭花</label></div>
                        <div class="form-check mb-2"><input class="form-check-input filter-checkbox" type="checkbox" value="蕨類" id="m3" onchange="filterPlants()"><label class="form-check-label small text-white-50" for="m3">古老真蕨 / 附生類</label></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-9" id="plant-list-container"></div>
        </div>
    </div>

    <footer class="text-center"><p class="mb-0">© 2026 FORMOSA ARCHIVE. BOTANICAL RESEARCH CENTER.</p></footer>

            { id: "thistle", name: "玉山薊", status: "一般野生", typeTag: "草本", region: "high", scientific: "Cirsium taiwanense", habitat: "高海拔冷杉林緣與開闊草生地", features: "悄然鐫刻於千元新台幣紙鈔上的隱秘靈草。全株武裝著剛硬銳利的尖刺以禦嚴寒與野獸，花序垂首開出深邃的暗紫，散發出島嶼脊樑特有的冷冽野性。", image: "https://images.chinatimes.com/newsphoto/2018-10-29/656/20181029003207.jpg", videoUrl: "https://www.youtube.com/results?search_query=玉山薊+紀錄片" },
            { id: "hayata", name: "台灣杉", status: "珍貴稀有", typeTag: "喬木", region: "mid", scientific: "Taiwania cryptomerioides", habitat: "中高海拔混合林深處", features: "全球唯一以「台灣」作為屬名的孑遺針葉樹。木理如雲似霞，樹幹挺拔筆直衝雲霄，動輒高達七十公尺，被原住民敬畏地稱為「撞到月亮的樹」。", image: "https://upload.wikimedia.org/wikipedia/commons/9/9b/Taiwania_cryptomerioides3.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣杉+撞到月亮的樹" },
            { id: "lily", name: "台灣百合", status: "一般野生", typeTag: "草本", region: "low", scientific: "Lilium formosanum", habitat: "全島從垂直海岬到高山峭壁", features: "最能代表海島草根韌性的原生花卉。純白碩大的喇叭狀花瓣背面，鐫刻著紫紅色的高雅條紋。從劇烈海風的鹹水岩壁到寒冷高山，皆能綻放出強悍而純潔的生命力。", image: "https://upload.wikimedia.org/wikipedia/commons/6/6b/Lilium_formosanum_sphl.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣百合+紀錄片" },
            { id: "pleione", name: "新竹石斛", status: "瀕臨絕種", typeTag: "草本", region: "low", scientific: "Dendrobium somae", habitat: "低海拔極為陰濕的闊葉老樹高枝", features: "神祕附生於原始密林巨木高處的稀世幽蘭。花姿玲瓏剔透，現出淡雅的黃綠光澤。因對森林鬱閉度與濕度有著近乎苛求的依賴，在野外已如鳳毛麟角。", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhIEe4uLPFj-DgXc14NUba40h0SAoWAUlRkIu_l1ZVvf-qdJXVY0hokCBBP_DVQKyPGPcbzRNISBO7BWu2_Nxo22343iCQSE_Nqh-xiwCL6SATSNi83UTnggDu8iEtYU5zahAtvTKUrAD4/s1600/37126283.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣野生石斛蘭" },
            { id: "cowania", name: "台灣青楓", status: "一般野生", typeTag: "喬木", region: "low", scientific: "Acer serrulatum", habitat: "全島中低海拔山區林中", features: "秋染 Formosa 山谷的華麗主角。掌狀五裂的精緻葉片，在每年深秋東北季風催逼下，會極具張力地蛻變為璀璨奪目的鮮紅，是島嶼秋季不可多得的視覺盛宴。", image: "https://theme.forest.gov.tw/forestplant/pic/43/43_2020121209435802696hm2d.jpg", videoUrl: "https://www.youtube.com/results?search_query=台灣青楓+賞楓" },
            { id: "fern", name: "台灣原始觀音座蓮", status: "珍貴稀有", typeTag: "蕨類", region: "low", scientific: "Archangiopteris itoi", habitat: "僅存於台灣中部極少數極度陰濕之谷地", features: "極度古老的大型真蕨生物。全球僅奇蹟般地殘存於南投幾處幽暗、近乎與世隔絕的溪谷中。巨大的羽狀複葉基部堆疊如蓮花法座，是無可替代的演化瑰寶。", image: "https://jalife.cafe/wp-content/uploads/2017/04/%E5%8F%B0%E7%81%A3%E5%8E%9F%E5%A7%8B%E8%A7%80%E9%9F%B3%E5%BA%A7%E8%93%AEDSC_0761.jpg", videoUrl: "https://www.youtube.com/results?search_query=原始觀音座蓮+蕨類" }
        ];

        let currentRegion = 'all';

        function renderPlants(filteredList) {
            const container = document.getElementById('plant-list-container');
            container.innerHTML = '';
            if(filteredList.length === 0) {
                container.innerHTML = `<div class="p-5 text-center text-white-50">沒有符合篩選條件的植物數據。</div>`;
                return;
            }
            filteredList.forEach(plant => {
                container.innerHTML += `
                    <section id="${plant.id}" class="plant-section">
                        <div class="row align-items-center g-5">
                            <div class="col-lg-5"><div class="img-container"><img src="${plant.image}" class="plant-img" alt="${plant.name}"></div></div>
                            <div class="col-lg-7">
                                <div><span class="status-badge">${plant.status}</span></div>
                                <h2 class="fw-bold m-0"><a href="${plant.videoUrl}" target="_blank" class="plant-title-link" title="觀看紀錄片">${plant.name} <span class="video-hint">DOCUMENTARY ↗</span></a></h2>
                                <div class="scientific-name">${plant.scientific}</div>
                                <div class="meta-box"><span class="meta-label">HABITAT / 棲地環境</span><span class="text-white-50">${plant.habitat}</span></div>
                                <p class="features-text">${plant.features}</p>
                            </div>
                        </div>
                    </section>`;
            });
        }

        function filterPlants() {
            const checkedBoxes = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(cb => cb.value);
            const statusFilters = checkedBoxes.filter(val => ["瀕臨絕種", "珍貴稀有", "一般野生"].includes(val));
            const typeFilters = checkedBoxes.filter(val => ["喬木", "草本", "蕨類"].includes(val));
            
            const searchQuery = document.getElementById('keyword-search').value.toLowerCase().trim();

            let result = plants;
            if (currentRegion !== 'all') result = result.filter(p => p.region === currentRegion);
            if (statusFilters.length > 0) result = result.filter(p => statusFilters.includes(p.status));
            if (typeFilters.length > 0) result = result.filter(p => typeFilters.includes(p.typeTag));
            
            if (searchQuery !== '') {
                result = result.filter(p => 
                    p.name.toLowerCase().includes(searchQuery) || 
                    p.scientific.toLowerCase().includes(searchQuery) || 
                    p.habitat.toLowerCase().includes(searchQuery) || 
                    p.features.toLowerCase().includes(searchQuery)
                );
            }

            renderPlants(result);
        }

        function filterRegion(region, element) {
            currentRegion = region;
            document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const title = document.getElementById('panel-title');
            const desc = document.getElementById('panel-desc');
            const alertBox = document.getElementById('panel-alert');

            if(region === 'all') {
                title.innerText = "台灣特有植物分佈面板";
                desc.innerText = "點選左側垂直海拔高度帶，系統將載入對應之植被垂直分佈數據與保育警示。";
                alertBox.innerText = "📢 宣導：森林為全島之肺，入山請落實無痕山林，嚴禁任意採摘任何野生植物。";
            } else if (region === 'high') {
                title.innerText = "🏔️ 垂直帶：高山寒帶及高山頂稜線 (3000m+)";
                desc.innerText = "強風、低溫與高輻射環境。此區植物多為低矮草本或具粗厚地被特性的強韌亞高山灌木。";
                alertBox.innerText = "🚫 宣導：高山高寒生態系極其脆弱，請踩踏於步道內，避免破壞高山草本地被。";
            } else if (region === 'mid') {
                title.innerText = "🌲 垂直帶：盛行針葉林與盛行雲霧帶 (1500m - 2500m)";
                desc.innerText = "終年雲霧繞，濕度極高。為台灣最著名的珍貴檜木林與臺灣杉巨木群分布核心區。";
                alertBox.innerText = "🌲 宣導：檜木與針葉巨木群皆受國家法律嚴格保護，嚴禁攀爬或破壞樹皮。";
            } else if (region === 'low') {
                title.innerText = "🌿 垂直帶：低海拔溪谷與次生闊葉林林地";
                desc.innerText = "環境潮濕陰暗，適宜古老附生蘭花與珍稀有尾蕨類附著生長之潮濕谷地環境。";
                alertBox.innerText = "📢 宣導：此區鄰近人類活動範圍，請勿隨意野放外來種植物，避免造成原生種生態危機。";
            }
            filterPlants();
        }

        renderPlants(plants);
    </script>
</body>
</html>
